version: 1

# secrets · 凭据泄漏（默认必装）
#
# 覆盖三类泄漏路径：
#   1. agent 直接读凭据文件
#   2. agent 访问云元数据端点拿临时凭据
#   3. agent 把密钥内容发/写到外部（issue、PR、消息、HTTP body）
#
# 明确不覆盖（架构限制，见 README）：**工具返回值里含密钥**这种情况。
# 代理只判定请求，不看响应 —— 要做需要在响应方向加规则引擎，留到后续。

rules:
  # ── 0. bash 读凭据（P0 补丁）────────────────────────────────────
  # 上面的专用工具规则拦不住 bash：基线放行了整个 bash 工具，
  # 而 `cat .env` / `printenv` 这类调用之前是放行的（实测）。
  # 动词白名单 + 文件名负向断言（排除 .env.example / .sample / .template），
  # 17 条用例实测 16 正确；唯一误伤（引号内字面提及）由 except 机制在 0.2.0 兜底。
  # 明确拦不住的变形：$() 命令替换、变量拼接、python -c、任意编码变换 —— 概率性防线。
  - id: secrets-shell-read
    match:
      tool: [bash, shell, run_command, execute_command, run_terminal_cmd, terminal, powershell]
      args.command:
        regex: '(?:^|[\s;&|(])(?:cat|less|more|head|tail|bat|strings|xxd|base64|cp|rsync|scp|tar|openssl|grep|awk|sed)\b[^\n]{0,200}?\.env(?!\.example|\.sample|\.template)\b'
    except:
      args.command:
        regex: 'grep\s+-r\s+["''][^"'']*\.env'
    decision: deny
    reason: 通过 shell 读取凭据文件

  - id: secrets-shell-key-file
    match:
      tool: [bash, shell, run_command, execute_command, run_terminal_cmd, terminal, powershell]
      args.command:
        regex: '(?:^|[\s;&|(])(?:cat|less|head|tail|base64|cp|rsync|scp|tar|openssl|ssh-add)\b[^\n]{0,200}?(?:id_rsa|id_ed25519|\.aws/credentials|\.npmrc|\.netrc|\.git-credentials)'
    except:
      args.command:
        regex: 'grep\s+-r\s+["''][^"'']*(?:id_rsa|\.npmrc)'
    decision: deny
    reason: 通过 shell 读取私钥或云凭据

  - id: secrets-shell-env-dump
    match:
      tool: [bash, shell, run_command, execute_command, run_terminal_cmd, terminal, powershell]
      args.command:
        regex: '(?:^|[\s;&|])(?:printenv|env)(?:\s*\||\s*$)'
    decision: deny
    reason: 导出全部环境变量（可能含密钥）

  # ── 1. 读凭据文件 ─────────────────────────────────────────────────
  # .env 家族用 regex 而不是 glob：要排除 .env.example / .env.sample / .env.template
  # 这些模板文件本来就要读。deny 压过 allow，写成 glob 就再也没有办法放行它们了。
  # 同时要兼容 Windows 反斜杠路径，所以分隔符写成 [/\\]。
  - id: secrets-read-env
    match:
      tool: [read_file, read_text_file, read_multiple_files, view_file, open_file]
      args.path:
        regex: '(?:^|[/\\])\.env(?:\.(?!example$|sample$|template$)[A-Za-z0-9_-]+)*$'
    decision: deny
    reason: 敏感凭据文件（.env）

  - id: secrets-read-key-file
    match:
      tool: [read_file, read_text_file, read_multiple_files, view_file, open_file]
      args.path:
        glob:
          - '**/*.pem'
          - '**/*.key'
          - '**/id_rsa*'
          - '**/id_ed25519*'
          - '**/id_ecdsa*'
          - '**/.aws/credentials'
          - '**/.npmrc'
          - '**/.netrc'
          - '**/.git-credentials'
          - '**/*.p12'
          - '**/*.pfx'
    decision: deny
    reason: 敏感凭据文件（私钥 / 云凭据）

  # read_multiple_files 用的是 paths（复数）—— 方案示例里的 args.path 对真实 server 不生效
  - id: secrets-read-multiple-env
    match:
      tool: [read_multiple_files]
      args.paths:
        regex: '(?:^|[/\\])\.env(?:\.(?!example$|sample$|template$)[A-Za-z0-9_-]+)*$'
    decision: deny
    reason: 批量读取中包含 .env

  - id: secrets-read-multiple-key
    match:
      tool: [read_multiple_files]
      args.paths:
        glob:
          - '**/*.pem'
          - '**/*.key'
          - '**/id_rsa*'
          - '**/id_ed25519*'
          - '**/.aws/credentials'
          - '**/.npmrc'
          - '**/.netrc'
          - '**/.git-credentials'
    decision: deny
    reason: 批量读取中包含私钥或云凭据

  # ── 2. 云元数据端点 ───────────────────────────────────────────────
  - id: secrets-cloud-metadata-command
    match:
      tool: [bash, shell, run_command, execute_command, terminal, powershell]
      args.command:
        regex: '169\.254\.169\.254'
    decision: deny
    reason: 访问云实例元数据端点（可换取临时凭据）

  - id: secrets-cloud-metadata-url
    match:
      tool: [fetch, web_fetch, http_request, http_get, curl, browser_navigate]
      args.url:
        regex: '169\.254\.169\.254'
    decision: deny
    reason: 访问云实例元数据端点（可换取临时凭据）

  # ── 3. 把疑似密钥写进外发内容 ─────────────────────────────────────
  # 只覆盖常见外发字段。字段名的多样性是这类规则最脆弱的地方，
  # 写错字段不会报错但永不命中，所以宁可多列几个。
  - id: secrets-leak-body
    match:
      tool: [create_issue, create_pull_request, post_message, send_message, http_request, fetch, web_fetch, create_comment, update_issue]
      args.body:
        regex: '(?:\bsk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
    decision: deny
    reason: 外发内容中疑似包含密钥

  - id: secrets-leak-content
    match:
      tool: [create_issue, create_pull_request, post_message, send_message, http_request, fetch, web_fetch, create_comment, update_issue]
      args.content:
        regex: '(?:\bsk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
    decision: deny
    reason: 外发内容中疑似包含密钥

  - id: secrets-leak-text
    match:
      tool: [create_issue, create_pull_request, post_message, send_message, http_request, fetch, web_fetch, create_comment, update_issue]
      args.text:
        regex: '(?:\bsk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
    decision: deny
    reason: 外发内容中疑似包含密钥

  - id: secrets-leak-description
    match:
      tool: [create_issue, create_pull_request, post_message, send_message, http_request, fetch, web_fetch, create_comment, update_issue]
      args.description:
        regex: '(?:\bsk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
    decision: deny
    reason: 外发内容中疑似包含密钥
